    image: rust_rock.jpg
    denoise: 0.65
    seed: 6704
    cfg: 6.5
    negative: >-
      lava, magma, molten, glowing, ember, fire, neon orange, fluorescent,
      terracotta, brick, pottery, moss, green vegetation, leaves,
      coarse white speckle, granite, salt and pepper crystals,
