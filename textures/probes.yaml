# Look tests for the Massif terrain set, art-directed from the autumn Ötztal
# valley reference plus the green alpine meadow reference.
#
#   go-task probe                      # all of them
#   go-task probe-only -- meadow_grass,scree_fine
#
# Albedo only at 1024, ~8s each. Settle the look here, then promote winners
# into materials.yaml for the full 8K PBR run.
#
# Two lessons paid for in failed rounds:
#
#  1. Never name a thing you don't want, even negated. "snow-free ledges"
#     produced snow. Unwanted things go in `negative`, never in `prompt`.
#  2. Text-to-image alone collapses top-down organic ground into dried mud
#     cracks or the wrong plant. Those materials set `image:` and start from a
#     CC0 photo instead (see assets/photo/SOURCES.md); the prompt then only has
#     to steer species and colour, not invent the structure.

defaults:
  size: 1024
  steps: 26
  cfg: 5.5
  denoise: 0.55        # only used by probes that set `image:`
  negative: >-
    sky, horizon, mountain landscape, scenery, perspective, depth of field,
    cast shadow, hard sunlight, blurry, vignette, watermark, text, border,
    dry stone wall, masonry, bricks, mortar

probes:
  # --- ground cover: seeded from CC0 photos --------------------------------

  - name: meadow_grass
    image: grass_dense.jpg
    denoise: 0.5
    seed: 210
    negative: >-
      straw, hay, dried grass, wheat, fur, animal hair, mowed lawn, garden turf,
      artificial grass, golf course, neon green, oversaturated, large flowers,
      clover blooms, sky, perspective, cast shadow, blurry, watermark, text
    prompt: >-
      seamless tileable texture, bright fresh green alpine meadow seen from directly
      above, fine dense grass blades, scattered tiny yellow and violet wildflowers,
      a few small grey stones half buried in the sward, natural colour variation,
      top-down orthographic scan, flat even diffuse lighting, no shadows,
      photogrammetry ground scan, extreme micro detail

  - name: alpine_grass_dry
    # It is soil with grass in it, not grass with soil in it — seeding from the
    # dirt scan gives the bare ground; the prompt grows the tufts on top.
    image: dirt_gravel.jpg
