  # --- reference round: Oetztal photo set, round 2 -------------------------
  # Ten materials read off the five reference photographs (see references/).
  # Ground-truth crops the critic grades against live in references/crops/.
  #
  # Round 1 lost 10/10 to a blind critic. Four causes, all addressed here:
  #
  #  1. Baked lighting failed eight of ten. Every probe now carries the shared
  #     `flat` negative tail below, and the pipeline gains a de-light pass before
  #     CHORD — CHORD's own basecolour was measured and does not remove shading.
  #  2. Loose rock collapsed into a shrinkage-crack lattice exactly as organic
  #     ground does. The crack vocabulary now sits in the negative of every
  #     clast material, and the prompts say *overlapping* and *resting on*.
  #  3. The four lowland ambientCG seeds overrode their targets. Every seeded
  #     probe now starts from an alpine-appropriate CC0 scan.
  #  4. Nothing stated the tile's real-world size, so features came out at five
  #     to ten times scale. Every prompt now opens by naming the 2 m patch and
  #     gives the intended clast or leaf size in centimetres.

  # Shared negative tails, spliced into each probe below by hand rather than by
  # anchor so a single probe can drop one without dropping the rest.
  #
  #   flat:   ambient occlusion, contact shadow, cast shadow, drop shadow,
  #           directional light, sunlight, rim light, specular highlight, sheen,
  #           gloss, wet look, dew drops, water droplets, vignette
  #   fused:  crack network, cracked surface, shrinkage cracks, dried mud,
  #           mud cracks, crazed glaze, jigsaw pieces, interlocking cells,
  #           flagstone, crazy paving, mosaic, grout, tiles
  #   cgi:    cgi, 3d render, videogame asset, stylized, low poly, plastic, clay,
  #           wax, smooth shading, airbrushed, illustration

